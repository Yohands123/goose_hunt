[package]
name = "goose-engine"
version = "0.1.0"
edition = "2021"
description = "Polygon geofence lookups for Goose Turf"

[dependencies]
axum = "=0.7.5"
tokio = { version = "=1.38.0", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
