services:
  redis:
    image: redis:7-alpine
  mongo:
    image: mongo:7
    volumes: [mongo:/data/db]
  engine:
    build: { context: ., dockerfile: engine/Dockerfile }
    ports: ["7070:7070"]
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      ENGINE_URL: http://engine:7070
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017
    ports: ["8080:8080"]
    depends_on: [engine, redis, mongo]
  web:
    build: { context: ., dockerfile: web/Dockerfile, args: { NEXT_PUBLIC_API_URL: http://localhost:8080 } }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  mongo: {}
